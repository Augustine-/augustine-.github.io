<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Augustine Wittkower</title>
    <meta name="description" content="Augustine Wittkower — a business card you can pick up.">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="Augustine Wittkower">
    <meta property="og:description" content="A business card you can pick up.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://augustine.io/v2/">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>A</text></svg>">

    <!-- The room is dark unless the visitor has asked for light. Resolved before first paint. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('augustine-io-theme');
          document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="stylesheet" href="card.css">
    <script src="card.js" defer></script>

    <!-- Analytics (PostHog: pageviews + link clicks via autocapture) -->
    <script src="/scripts/analytics.js" defer></script>
</head>
<body>
    <canvas class="table" aria-hidden="true"></canvas>
    <button class="theme-toggle" type="button" aria-label="Toggle the room lights"></button>

    <main class="room">
      <div class="scene">
        <div class="card" id="card">

          <section class="face front" aria-label="Front of the card" data-watermark="AW">
            <canvas class="paper" aria-hidden="true"></canvas>
            <div class="content">
              <h1 class="name caps gloss" data-t>Augustine Wittkower</h1>
              <p class="tagline caps" data-t data-ink="0.62">making it happen</p>
              <div class="actions">
                <button data-t class="flip cta caps gloss-rule" type="button">projects</button>
                <button data-t class="links-toggle" type="button" data-ink="0.6" aria-expanded="false" aria-controls="contacts">links</button>
              </div>
              <nav class="contacts" id="contacts" aria-label="Links">
                <a data-t href="https://www.github.com/Augustine-">github</a>
                <span class="sep" data-t data-ink="0.35" aria-hidden="true">&middot;</span>
                <a data-t href="https://www.linkedin.com/in/augustineprime">linkedin</a>
                <span class="sep" data-t data-ink="0.35" aria-hidden="true">&middot;</span>
                <a data-t href="https://twitter.com/augustinefacts">@augustinefacts</a>
                <span class="sep" data-t data-ink="0.35" aria-hidden="true">&middot;</span>
                <a data-t href="https://misterfacts.substack.com">blog</a>
                <span class="sep" data-t data-ink="0.35" aria-hidden="true">&middot;</span>
                <a data-t class="email" href="mailto:augustine.wittkower@gmail.com" data-email="augustine.wittkower@gmail.com">email</a>
              </nav>
              <p class="note" data-t data-ink="0.55" aria-live="polite"></p>
            </div>
          </section>

          <section class="face back" aria-label="Back of the card" data-watermark="AW" inert>
            <canvas class="paper" aria-hidden="true"></canvas>
            <div class="content">
              <h2 class="heading caps" data-t>Projects</h2>
              <ul class="projects">
                <li><a data-t href="https://charis.day">charis.day</a><span class="dash" data-t data-ink="0.4">&mdash;</span><span class="blurb" data-t data-ink="0.62">your friends, on a living globe</span></li>
                <li><a data-t href="https://grindstone.gg">grindstone.gg</a><span class="dash" data-t data-ink="0.4">&mdash;</span><span class="blurb" data-t data-ink="0.62">WoW gear upgrade engine</span></li>
                <li><a data-t href="/mondolla/">mondolla</a><span class="dash" data-t data-ink="0.4">&mdash;</span><span class="blurb" data-t data-ink="0.62">live currency mandala visualizer</span></li>
                <li><a data-t href="https://github.com/Augustine-/hestia">hestia</a><span class="dash" data-t data-ink="0.4">&mdash;</span><span class="blurb" data-t data-ink="0.62">hearth goddess for your PC's temps</span></li>
              </ul>
              <p class="flip-back"><i data-t data-ink="0.7">catch you on the</i><button data-t class="flip" type="button">flip</button></p>
            </div>
            <a class="mandala-wink" href="/mandala.html" aria-label="mandala"></a>
          </section>

          <div class="edge edge-l" aria-hidden="true"></div>
          <div class="edge edge-r" aria-hidden="true"></div>
          <div class="edge edge-t" aria-hidden="true"></div>
          <div class="edge edge-b" aria-hidden="true"></div>
        </div>
      </div>
      <p class="hint"></p>
    </main>
</body>
</html>
